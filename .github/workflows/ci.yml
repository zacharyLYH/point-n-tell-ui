name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # arm64 so the container matches the checked-in screenshot baselines
    # (public repos get free arm64 runners).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.test
          tags: point-n-tell-ui-tests
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same command as local: headed Chromium under Xvfb in the container.
      - run: sh scripts/test-docker.sh
        env:
          PNT_SKIP_BUILD: '1'

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
